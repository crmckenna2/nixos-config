# Window Layout
hide_window_decorations yes

# Background 
background_opacity 0.85
background_blur 16

# Keybinds
map kitty_mod+f5 load_config_file

# Set the font
font_family	 Cascadia Code
bold_font	 auto
italic_font	 auto
bold_italic_font auto

# Include the color scheme
include ../../.local/state/sts/kitty-theme.conf
